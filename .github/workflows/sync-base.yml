name: sync base

# Every day, move to the latest commit of the shared base (Phygital-Key/phygital-key).
# Job 1 builds and tests it with read-only rights. Job 2 then saves ONLY Cargo.lock
# and the files made from the base templates (never the release keys, never anything
# else), and starts the full CI on the result (every OS, the secure install, the
# container). Releases still need a v* tag that only an admin can push.
on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  # The only files the sync may change.
  ALLOWED: |
    Cargo.lock
    install-service.sh
    install.sh
    tests/secure-install.sh
    scripts/release-key.sh
    scripts/package-manifests.sh

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.up.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Take the latest base
        id: up
        shell: bash
        run: |
          set -euo pipefail
          cargo update -p phygital-key-gate -p phygital-key-verify
          cargo build --release --locked
          bin=$(sed -n 's/^name = "\(.*\)"/\1/p' Cargo.toml | head -1)
          "target/release/$bin" product-files --out .
          printf '%s\n' "$ALLOWED" | sed '/^$/d' > "$RUNNER_TEMP/allowed"
          changed=$(git status --porcelain | cut -c4-)
          if [ -z "$changed" ]; then echo "changed=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          if printf '%s\n' "$changed" | grep -vxF -f "$RUNNER_TEMP/allowed"; then
            echo "the base changed files the sync may not touch (above). Stopping." >&2; exit 1
          fi
          echo "changed=yes" >> "$GITHUB_OUTPUT"
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
      - name: Tests
        if: steps.up.outputs.changed == 'yes'
        run: cargo test --locked
      - name: End-to-end checks
        if: steps.up.outputs.changed == 'yes'
        working-directory: tests/e2e
        env:
          PKA_BIN: ${{ github.workspace }}/target/release/${{ steps.up.outputs.bin }}
        run: |
          npm ci --no-fund --no-audit
          npx playwright install --with-deps chromium
          node run.mjs
      - name: Hand over only the allowed files
        if: steps.up.outputs.changed == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          while read -r f; do
            mkdir -p "$RUNNER_TEMP/out/$(dirname "$f")"; cp "$f" "$RUNNER_TEMP/out/$f"
          done < "$RUNNER_TEMP/allowed"
      - if: steps.up.outputs.changed == 'yes'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: base-update
          path: ${{ runner.temp }}/out/

  save:
    needs: test
    if: needs.test.outputs.changed == 'yes'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the allowed files
      actions: write    # start the full CI on the result
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: base-update
          path: ${{ runner.temp }}/in
      - name: Save the update and run the full CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s\n' "$ALLOWED" | sed '/^$/d' > "$RUNNER_TEMP/allowed"
          while read -r f; do
            [ -f "$RUNNER_TEMP/in/$f" ] && [ ! -L "$RUNNER_TEMP/in/$f" ] || { echo "missing $f" >&2; exit 1; }
            cp "$RUNNER_TEMP/in/$f" "$f"
          done < "$RUNNER_TEMP/allowed"
          changed=$(git status --porcelain | cut -c4-)
          if printf '%s\n' "$changed" | grep -vxF -f "$RUNNER_TEMP/allowed"; then
            echo "unexpected changes (above). Stopping." >&2; exit 1
          fi
          git diff --quiet -- release-keys.pem || { echo "release-keys.pem may never change here" >&2; exit 1; }
          base=$(sed -n 's/.*phygital-key?branch=main#\([0-9a-f]\{12\}\).*/\1/p' Cargo.lock | head -1)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          xargs git add -- < "$RUNNER_TEMP/allowed"
          git commit -m "Update the base to ${base:-latest}"
          git push origin HEAD:main
          gh workflow run ci.yml --ref main
