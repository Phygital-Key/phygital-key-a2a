name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, exe: phygital-key-a2a }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, exe: phygital-key-a2a }
          - { os: macos-latest, target: aarch64-apple-darwin, exe: phygital-key-a2a }
          - { os: macos-15-intel, target: x86_64-apple-darwin, exe: phygital-key-a2a }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, exe: phygital-key-a2a.exe }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write       # build provenance (who built each file, from which commit)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo test --locked
      # No features: the conformance-kit test behaviours (`--features tck`) are never released.
      - run: cargo build --release --locked -p phygital-key-a2a --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="phygital-key-a2a-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" README.md LICENSE NOTICE "$name/"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a "$name.zip" "$name" > /dev/null
            sha256sum "$name.zip" > "$name.zip.sha256"
          else
            tar czf "$name.tar.gz" "$name"
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
      # A signed record (GitHub build provenance) that this workflow built these
      # exact files from this tag's commit. Anyone can check it with
      # `gh attestation verify <file> --repo Phygital-Key/phygital-key-a2a`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            phygital-key-a2a-*.tar.gz
            phygital-key-a2a-*.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: |
            phygital-key-a2a-*.tar.gz*
            phygital-key-a2a-*.zip*

  publish:
    needs: build
    runs-on: ubuntu-latest
    # The "release" environment holds the release signing key and runs only for v*
    # tags, which only repository admins can push. (It can also be set to wait for
    # the owner's approval: Settings, Environments, release, Required reviewers.)
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: src
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
          path: dist
      - name: Sign the release list (release.txt)
        shell: bash
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          V="$GITHUB_REF_NAME"
          [[ "$V" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad tag $V"; exit 1; }
          [ -n "$RELEASE_SIGNING_KEY" ] || { echo "no RELEASE_SIGNING_KEY in the release environment: run scripts/release-key.sh"; exit 1; }
          cd dist
          {
            echo "phygital-key release manifest v1"
            echo "version $V"
            for f in $(ls phygital-key-a2a-"$V"-*.tar.gz phygital-key-a2a-"$V"-*.zip | sort); do
              echo "$(sha256sum "$f" | cut -d ' ' -f 1)  $f"
            done
          } > release.txt
          [ "$(wc -l < release.txt)" -ge 3 ] || { echo "no release files"; exit 1; }
          # release2.txt: the same files, plus when it was signed and until when it is
          # trusted (180 days). Older installs read release.txt.
          signed=$(date +%s)
          {
            echo "phygital-key release manifest v2"
            echo "version $V"
            echo "signed $signed"
            echo "expires $((signed + 180 * 86400))"
            sed -n '3,$p' release.txt
          } > release2.txt
          umask 077
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/release-key.pem"
          openssl dgst -sha256 -sign "$RUNNER_TEMP/release-key.pem" -out release.txt.sig release.txt
          openssl dgst -sha256 -sign "$RUNNER_TEMP/release-key.pem" -out release2.txt.sig release2.txt
          rm -f "$RUNNER_TEMP/release-key.pem"
          # The signature must check out with a key pinned in this commit's installer.
          awk '/-----BEGIN PUBLIC KEY-----/{n++; f="pin-" n ".pem"} f{print > f} /-----END PUBLIC KEY-----/{close(f); f=""}' \
            ../src/release-keys.pem
          ok=no
          for k in pin-*.pem; do
            [ -f "$k" ] && openssl dgst -sha256 -verify "$k" -signature release.txt.sig release.txt >/dev/null &&
              openssl dgst -sha256 -verify "$k" -signature release2.txt.sig release2.txt >/dev/null && ok=yes
          done
          rm -f pin-*.pem
          [ "$ok" = yes ] || { echo "the signature does not match a key pinned in release-keys.pem"; exit 1; }
          cat release.txt release2.txt
      # The second, post-quantum signature (ML-DSA-65) of release2.txt, made by the
      # program this run built. Required once an ML-DSA key is pinned.
      - name: Sign the release list with ML-DSA (release2.txt.mldsa)
        shell: bash
        env:
          RELEASE_MLDSA_KEY: ${{ secrets.RELEASE_MLDSA_KEY }}
        run: |
          set -euo pipefail
          V="$GITHUB_REF_NAME"
          n="phygital-key-a2a-$V-x86_64-unknown-linux-gnu"
          tar --no-same-owner -xzf "dist/$n.tar.gz" -C "$RUNNER_TEMP"
          prog="$RUNNER_TEMP/$n/phygital-key-a2a"
          if grep -q "BEGIN ML-DSA-65 PUBLIC KEY" src/release-keys.pem; then
            [ -n "$RELEASE_MLDSA_KEY" ] || { echo "an ML-DSA key is pinned but RELEASE_MLDSA_KEY is missing: run scripts/release-key.sh --pq"; exit 1; }
            "$prog" release-sign-pq --file dist/release2.txt --out dist/release2.txt.mldsa
            "$prog" release-check --file dist/release2.txt --sig dist/release2.txt.sig --pq-sig dist/release2.txt.mldsa
          else
            # Still checks the v2 list with the program, so a format mistake stops here.
            "$prog" release-check --file dist/release2.txt --sig dist/release2.txt.sig
          fi
      # Plain gh, already on the runner: no third-party action in the job that
      # holds the release signing key.
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME" \
            dist/phygital-key-a2a-* dist/release.txt dist/release.txt.sig dist/release2.txt* src/install.sh src/install-service.sh

  # npm: @phygital-key/a2a (the launcher, `npx -y @phygital-key/a2a serve`) and one
  # package per target holding this release's program. npm trusts this workflow
  # through trusted publishing (with provenance), so no npm token is stored anywhere.
  npm:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # npm trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
          path: dist
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false  # no cache in a release job
      - name: Use the newest npm (trusted publishing needs 11.5.1 or newer)
        run: npm install -g npm@12.2.0  # zizmor: ignore[adhoc-packages] npm itself, pinned
      - name: Make and publish the npm packages
        shell: bash
        run: |
          set -euo pipefail
          packaging/npm/build.sh "${GITHUB_REF_NAME#v}" dist "$RUNNER_TEMP/npm"
          packaging/npm/publish.sh "$RUNNER_TEMP/npm"

  container:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # push ghcr.io/phygital-key/phygital-key-a2a
      id-token: write       # build provenance for the image
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
          path: dist
      - name: Unpack the released Linux binaries
        shell: bash
        run: |
          set -euo pipefail
          V="$GITHUB_REF_NAME"
          ctx=packaging/container
          mkdir -p "$ctx/data" "$ctx/bin/amd64" "$ctx/bin/arm64"
          for pair in "amd64 x86_64" "arm64 aarch64"; do
            set -- $pair
            n="phygital-key-a2a-$V-$2-unknown-linux-gnu"
            tar --no-same-owner -xzf "dist/$n.tar.gz" -C "$RUNNER_TEMP"
            install -m 0755 "$RUNNER_TEMP/$n/phygital-key-a2a" "$ctx/bin/$1/phygital-key-a2a"
          done
          cp NOTICE LICENSE "$ctx/"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: packaging/container
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/phygital-key/phygital-key-a2a:${{ github.ref_name }}
            ghcr.io/phygital-key/phygital-key-a2a:latest
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/phygital-key/phygital-key-a2a
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
